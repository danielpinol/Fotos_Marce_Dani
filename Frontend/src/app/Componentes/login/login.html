<div class="login-page">
  <div class="login-card">
    <div class="login-logo">X</div>
    <h1 class="login-title">Marche <span class="amp">&amp;</span> Dani</h1>
    <p class="login-sub">Pa siempre</p>

    <div class="field">
      <label class="field-label" for="username">Usuario</label>
      <input id="username" class="field-input" type="text"
             autocomplete="username" autocorrect="off" autocapitalize="none"
             placeholder="dani o marche"
             [value]="username()"
             (input)="username.set($any($event.target).value)"
             (keydown.enter)="submit()">
    </div>

    <div class="field">
      <label class="field-label" for="password">Contraseña</label>
      <input id="password" class="field-input" type="password" 
             autocomplete="current-password"
             placeholder="••••••••"
             [value]="password()"
             (input)="onPasswordInput($any($event.target).value)"
             (keydown.enter)="submit()">
    </div>

    @if (error()) {
      <p class="login-error">{{ error() }}</p>
    }

    <button class="login-btn" type="button"
            [disabled]="loading() || !username().trim() || !password()"
            (click)="submit()">
      {{ loading() ? 'Entrando…' : 'Entrar' }}
    </button>
  </div>
</div>
