<div class="app-shell">
  <main>
    <router-outlet />
  </main>
  <app-bottom-nav />
  <div class="theme-toggle">
    <button class="theme-btn" (click)="toggleTheme()"
            [attr.aria-label]="theme() === 'light' ? 'Cambiar a modo noche' : 'Cambiar a modo galería'">
      {{ theme() === 'light' ? '🌙' : '☀️' }}
    </button>
  </div>
</div>
